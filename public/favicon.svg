<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0D7377"/>
  <!-- 300° arc, 60° gap at bottom. Centre (32,32) r=22 -->
  <!-- Right gap edge at 60°: (43,51) | Left gap edge at 120°: (21,51) -->
  <!-- sweep=0 (CCW) takes the long way through right→top→left, gap stays at bottom -->
  <path d="M 43 51 A 22 22 0 1 0 21 51"
        stroke="white" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Road ribbon: tapered from full gap width at bottom, converging to tip near top -->
  <path d="M 43 51 C 40 38 34 23 32 12 C 30 23 24 38 21 51 Z"
        fill="white" opacity="0.72"/>
</svg>
