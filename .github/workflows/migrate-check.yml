name: Migration check

# PR gate for new/changed migrations.
#
# supabase/migrations/ has no migration that creates the base schema
# (public.profiles, etc.) — that schema predates the migrations folder and
# was applied to production by hand. Replaying every migration from an empty
# database (the old approach here) fails on the very first file for that
# reason, on every branch, regardless of what a PR actually changes.
#
# supabase/schema.sql is this repo's maintained "fresh install reference"
# (see CLAUDE.md) and is expected to reflect every migration merged so far.
# So instead of replaying history, this job seeds a fresh local stack from
# schema.sql and applies only the migration file(s) this PR adds or changes
# on top of it — which is the actual thing that needs validating before the
# migrate.yml workflow pushes them to production.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check migration filename convention
        run: |
          status=0
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            if ! [[ "$base" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error file=$f::Migration filename must match <14-digit-timestamp>_description.sql"
              status=1
            fi
          done
          exit $status

      - name: Determine migration files this PR adds or changes
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          # workflow_dispatch (manual runs, used to test this workflow itself)
          # has no PR base — fall back to diffing against main.
          if [ -z "$base" ]; then
            git fetch origin main
            base="origin/main"
          fi
          changed=$(git diff --name-only --diff-filter=AM "$base"...HEAD -- 'supabase/migrations/*.sql' | sort)
          if [ -z "$changed" ]; then
            echo "No migration files added or changed by this PR — nothing to validate."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "New/changed migrations:"
            echo "$changed"
            printf '%s\n' "$changed" > /tmp/new_migrations.txt
          fi

      - name: Start local stack with an empty migration set
        if: steps.diff.outputs.has_new == 'true'
        run: |
          # Move every existing migration out of the way first so `supabase start`
          # (which always replays supabase/migrations/ against a fresh database on
          # first boot) has nothing broken to fail on. We load the equivalent state
          # from schema.sql instead in the next step.
          mkdir -p /tmp/migrations_stash
          mv supabase/migrations/*.sql /tmp/migrations_stash/
          supabase start

      - name: Load schema.sql as the baseline
        if: steps.diff.outputs.has_new == 'true'
        run: |
          # Fixed local-dev connection defaults for the Supabase CLI, using this
          # repo's configured db port (supabase/config.toml [db] port).
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/schema.sql

      - name: Apply this PR's new/changed migration(s) on top of the baseline
        if: steps.diff.outputs.has_new == 'true'
        run: |
          while IFS= read -r f; do
            stashed="/tmp/migrations_stash/$(basename "$f")"
            echo "::group::Applying $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 -f "$stashed"
            echo "::endgroup::"
          done < /tmp/new_migrations.txt

      # Guards against exactly the drift this job exists to prevent: a
      # migration merges but schema.sql — the fresh-install reference this
      # repo ships and that CI itself treats as ground truth — never gets
      # updated to match. Left unchecked, that gap is invisible until someone
      # actually provisions a new environment from schema.sql (disaster
      # recovery, staging, a second region) and it silently comes up missing
      # the change. So: build a second, untouched database from schema.sql
      # alone, and diff its post-migration structure against the one built
      # above (schema.sql + this PR's migrations). A schema.sql that already
      # reflects the PR's migrations converges to the same structure either
      # way; any real difference means schema.sql needs the same update.
      - name: Assert schema.sql already reflects this PR's migration(s)
        if: steps.diff.outputs.has_new == 'true'
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          BASELINE="postgresql://postgres:postgres@127.0.0.1:54322/schema_sql_only"

          PGPASSWORD=postgres createdb -h 127.0.0.1 -p 54322 -U postgres schema_sql_only
          psql "$BASELINE" -v ON_ERROR_STOP=1 -f supabase/schema.sql

          pg_dump "$DB" --schema-only --no-owner --no-privileges \
            | grep -Ev '^--|^SET |^SELECT pg_catalog|^\\restrict|^\\unrestrict|^$' \
            > /tmp/schema_plus_migrations.sql
          pg_dump "$BASELINE" --schema-only --no-owner --no-privileges \
            | grep -Ev '^--|^SET |^SELECT pg_catalog|^\\restrict|^\\unrestrict|^$' \
            > /tmp/schema_sql_only.sql

          if ! diff -u /tmp/schema_sql_only.sql /tmp/schema_plus_migrations.sql; then
            echo "::error::supabase/schema.sql does not yet reflect the migration(s) in this PR." \
                 "Update schema.sql (fresh-install reference) so a database built from it alone" \
                 "matches one built from schema.sql + these migrations. See the diff above."
            exit 1
          fi
          echo "schema.sql already reflects this PR's migration(s) — no drift."
