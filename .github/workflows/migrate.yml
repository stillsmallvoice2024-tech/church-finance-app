name: Deploy migrations

# Automatically applies new files under supabase/migrations/ to the linked
# Supabase project whenever they land on main — no manual SQL-editor step.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  # Optional staging gate. Only runs (and only blocks production) once the
  # STAGING_SUPABASE_PROJECT_ID secret is set up on a separate Supabase
  # project that mirrors production. Until that secret exists this job is
  # skipped and does not gate deploy — see STAGING_SETUP.md to enable.
  deploy-staging:
    name: supabase db push (staging)
    runs-on: ubuntu-latest
    environment: staging
    if: vars.STAGING_SUPABASE_PROJECT_ID != '' || secrets.STAGING_SUPABASE_PROJECT_ID != ''
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}

      - name: Push migrations to staging
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

  deploy:
    name: supabase db push (production)
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-staging
    # needs a job that is skipped still counts as satisfied, so this does not
    # hard-block production until the staging secret above is configured.
    if: always() && needs.deploy-staging.result != 'failure'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Snapshot production schema before applying migrations
        run: |
          mkdir -p db-snapshots
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          supabase db dump --linked -f "db-snapshots/pre-migrate-${stamp}.sql"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-migrate-snapshot-${{ github.run_id }}
          path: db-snapshots/*.sql
          retention-days: 90

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
